name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

# Menor privilégio no nível do workflow; a escrita fica no job.
permissions:
  contents: read

jobs:
  analyze:
    name: Analisar JavaScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # App é JavaScript puro (sem etapa de compilação própria).
          build-mode: none

      - name: Analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
